<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kochbuch</title>
<meta name="robots" content="noindex">
<!--
  Die Seite, auf der ein Aktivierungslink landet (Supabase: Authentication -> URL
  Configuration -> Site URL). Eine einzelne Datei ohne Build-Schritt, damit sie
  irgendwo statisch liegen kann - siehe supabase/README.md.

  Sie darf NICHT auf *.supabase.co liegen: Weder Edge Functions noch Storage
  liefern dort HTML aus. Beide erzwingen `Content-Type: text/plain` und
  `Content-Security-Policy: default-src 'none'; sandbox` (am 10.08.2026 an beiden
  nachgemessen) - der Browser zeigte dem Nutzer den Quelltext.

  Farben und Schrift sind aus dem App-Theme uebernommen:
  ui/theme/Color.kt (Sand50/Sand100/Ink900/Ink700/Ink500/Clay500/Sage500) und
  ui/theme/Type.kt (Fraunces fuer Titel, System-Sans fuer Fliesstext).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    /* 60 % neutrale Basis */
    --sand-50:  #FCFAF7;
    --sand-100: #F6F1EA;
    --sand-200: #EBE3D8;
    /* 30 % Text und Struktur */
    --ink-900:  #1F1A16;
    --ink-700:  #4A423B;
    /* 10 % Akzent */
    --clay-500: #C05A31;
    --sage-500: #5E7355;
    --sage-100: #E6EDE1;
    --shadow:   rgba(107, 74, 52, 0.10);

    color-scheme: light; /* Die App ist bewusst hell - kein Umfaerben durch den Browser. */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--sand-50);
    color: var(--ink-700);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .karte {
    width: 100%;
    max-width: 26rem;
    background: var(--sand-100);
    border: 1px solid var(--sand-200);
    border-radius: 28px;              /* Radius.xl der App */
    padding: 40px 32px 36px;
    text-align: center;
    box-shadow: 0 18px 40px -18px var(--shadow);
    animation: auftauchen 0.45s cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }

  .marke {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-size: 0.95rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--clay-500);
    margin: 0 0 24px;
  }

  .haken {
    width: 84px;
    height: 84px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: var(--sage-100);
    display: grid;
    place-items: center;
    animation: aufploppen 0.4s cubic-bezier(0.34, 1.4, 0.64, 1) 0.1s both;
  }

  .haken svg { width: 40px; height: 40px; display: block; }

  .haken path {
    fill: none;
    stroke: var(--sage-500);
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 32;
    stroke-dashoffset: 32;
    animation: zeichnen 0.45s ease-out 0.35s both;
  }

  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 1.75rem;
    line-height: 1.25;
    color: var(--ink-900);
    margin: 0 0 12px;
  }

  p { margin: 0; }

  @keyframes auftauchen {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes aufploppen {
    from { opacity: 0; transform: scale(0.6); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes zeichnen {
    to { stroke-dashoffset: 0; }
  }

  /* Wer Bewegung abbestellt hat, bekommt dasselbe Bild - nur sofort. */
  @media (prefers-reduced-motion: reduce) {
    .karte, .haken, .haken path { animation: none; }
    .haken path { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
  <main class="karte">
    <p class="marke">Kochbuch</p>

    <div class="haken">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 12.5 L9.5 18 L20 6.5" />
      </svg>
    </div>

    <!--
      Der Auslieferungszustand ist ENGLISCH, nicht Deutsch - dieselbe Regel wie im
      Ressourcenordner `values/` der App: Englisch ist der Rueckfall fuer jede
      Sprache, die wir nicht kennen. Wer mit abgeschaltetem JavaScript kommt, sieht
      genau diesen Text.
    -->
    <h1 id="titel">All set!</h1>
    <p id="text">Your account is confirmed. You can close this window and sign in to the app.</p>
  </main>

<script>
  // Dieselben sechs Sprachen wie die App (AppLanguage). Der Browser wertet
  // Accept-Language nicht fuer uns aus - die Seite liegt statisch auf GitHub
  // Pages, es gibt keinen Server, der das koennte. Also hier, aus
  // navigator.languages.
  var TEXTE = {
    de: ["Alles klar!", "Dein Konto ist freigeschaltet. Du kannst dieses Fenster schließen und dich jetzt in der App anmelden."],
    en: ["All set!", "Your account is confirmed. You can close this window and sign in to the app."],
    fr: ["C’est fait !", "Votre compte est activé. Vous pouvez fermer cette fenêtre et vous connecter dans l’application."],
    es: ["¡Todo listo!", "Tu cuenta está activada. Puedes cerrar esta ventana e iniciar sesión en la aplicación."],
    it: ["Tutto fatto!", "Il tuo account è attivo. Puoi chiudere questa finestra e accedere all’app."],
    pl: ["Gotowe!", "Twoje konto jest aktywne. Możesz zamknąć to okno i zalogować się w aplikacji."]
  };

  // Nur der Sprachteil zaehlt: "de-AT" und "de-CH" sind hier dasselbe wie "de".
  var wunsch = navigator.languages && navigator.languages.length
    ? navigator.languages
    : [navigator.language || "en"];

  var treffer = "en";
  for (var i = 0; i < wunsch.length; i++) {
    var kurz = String(wunsch[i]).slice(0, 2).toLowerCase();
    if (TEXTE[kurz]) { treffer = kurz; break; }
  }

  document.documentElement.lang = treffer;
  document.getElementById("titel").textContent = TEXTE[treffer][0];
  document.getElementById("text").textContent = TEXTE[treffer][1];
</script>
</body>
</html>
